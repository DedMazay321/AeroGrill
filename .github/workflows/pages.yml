# Веб-версия: при каждом изменении страниц они публикуются на GitHub Pages
name: Сайт
on:
  push:
    branches: [main]
    paths: ['app/src/main/assets/www/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/www
      - id: deploy
        uses: actions/deploy-pages@v4
